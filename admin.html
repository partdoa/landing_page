<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    try {
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-container": "#ecedf7",
              "on-secondary": "#ffffff",
              "on-tertiary-fixed": "#311300",
              "on-secondary-fixed": "#001945",
              "on-surface": "#181c23",
              "tertiary-container": "#ba5900",
              "tertiary": "#944600",
              "tertiary-fixed-dim": "#ffb689",
              "surface-container-low": "#f2f3fd",
              "background": "#f9f9ff",
              "error": "#ba1a1a",
              "inverse-on-surface": "#eff0fa",
              "on-secondary-fixed-variant": "#00429b",
              "on-tertiary-fixed-variant": "#743500",
              "on-primary-fixed": "#001a40",
              "primary-fixed": "#d7e2ff",
              "on-error-container": "#93000a",
              "on-tertiary": "#ffffff",
              "muted": "#8b95a1",
              "surface-tint": "#005bbe",
              "secondary-fixed": "#d9e2ff",
              "surface-container-lowest": "#ffffff",
              "on-secondary-container": "#fefcff",
              "surface-container-highest": "#e0e2ec",
              "canvas": "#ffffff",
              "foreground": "#191f28",
              "primary-fixed-dim": "#acc7ff",
              "on-primary-container": "#fefcff",
              "weak-background": "#e8f3ff",
              "on-background": "#181c23",
              "primary": "#0059b9",
              "inverse-surface": "#2d3038",
              "surface-container-high": "#e6e8f2",
              "secondary-fixed-dim": "#b0c6ff",
              "outline": "#727785",
              "surface-dim": "#d8d9e3",
              "secondary": "#0056c6",
              "on-primary-fixed-variant": "#004491",
              "on-primary": "#ffffff",
              "border": "#e5e8eb",
              "surface-variant": "#e0e2ec",
              "on-tertiary-container": "#fffbff",
              "surface-bright": "#f9f9ff",
              "tertiary-fixed": "#ffdbc8",
              "on-error": "#ffffff",
              "danger": "#e42939",
              "primary-container": "#1071e5",
              "surface": "#f2f4f6",
              "body": "#4e5968",
              "secondary-container": "#2d6fe5",
              "on-surface-variant": "#414754",
              "error-container": "#ffdad6",
              "inverse-primary": "#acc7ff",
              "outline-variant": "#c1c6d6"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "xs": "4px",
              "margin-mobile": "20px",
              "lg": "16px",
              "md": "8px",
              "sm": "6px",
              "xl": "24px",
              "gutter": "12px",
              "xxl": "32px"
            },
            "fontFamily": {
              "body-sm": ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],
              "headline-xl": ["Plus Jakarta Sans"],
              "label-md": ["Plus Jakarta Sans"],
              "headline-sm": ["Plus Jakarta Sans"],
              "headline-xl-mobile": ["Plus Jakarta Sans"],
              "headline-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
              "body-sm": ["14px", {"lineHeight": "21px", "fontWeight": "400"}],
              "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
              "headline-md": ["24px", {"lineHeight": "36px", "fontWeight": "600"}],
              "headline-xl": ["36px", {"lineHeight": "54px", "fontWeight": "700"}],
              "label-md": ["15px", {"lineHeight": "20px", "fontWeight": "600"}],
              "headline-sm": ["22px", {"lineHeight": "33px", "fontWeight": "600"}],
              "headline-xl-mobile": ["28px", {"lineHeight": "40px", "fontWeight": "700"}],
              "headline-lg": ["30px", {"lineHeight": "45px", "fontWeight": "600"}]
            }
          }
        }
      }
    } catch (_e) {}
  </script>
</head>
<body class="bg-background text-on-background font-body-md antialiased relative min-h-screen flex flex-col pb-24 md:pb-0">
  <header class="bg-canvas sticky top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-xl h-16 max-w-7xl mx-auto shadow-sm">
    <div class="flex items-center">
      <div class="flex items-center gap-2" onclick="location.href='/'" class="cursor-pointer">
        <img alt="경춘부동산 로고" class="h-10 w-auto object-cover rounded-md" src="agent.jpg">
        <span class="text-headline-md font-headline-md font-bold text-primary cursor-pointer">경춘부동산</span>
      </div>
    </div>
    <nav class="hidden md:flex items-center gap-xl">
      <a class="text-body font-body-md hover:text-primary transition-colors px-3 py-2 rounded-lg" href="/">홈</a>
      <a class="text-body font-body-md hover:text-primary transition-colors px-3 py-2 rounded-lg" href="#">매물목록</a>
      <a class="text-body font-body-md hover:text-primary transition-colors px-3 py-2 rounded-lg" href="news">뉴스/소식</a>
    </nav>
    <div class="flex items-center gap-md">
      <button id="header-logout-btn" onclick="handleLogout()" class="hidden text-body font-body-sm hover:underline p-2">로그아웃</button>
    </div>
  </header>

  <main class="flex-grow w-full max-w-7xl mx-auto px-margin-mobile md:px-xl py-xl md:py-xxl flex flex-col justify-center">
    
    <!-- 1. Login Form Area (비로그인 상태) -->
    <div id="login-section" class="w-full max-w-md mx-auto" style="display:none;">
      <div class="bg-canvas border border-border rounded-2xl p-xl shadow-sm">
        <h2 class="text-headline-sm font-bold text-on-surface mb-lg text-center">관리자 로그인</h2>
        <form onsubmit="handleLoginSubmit(event)" class="flex flex-col gap-lg">
          <div class="flex flex-col gap-2">
            <label for="password" class="font-label-md text-on-surface text-sm">비밀번호</label>
            <input id="password" type="password" required placeholder="관리자 비밀번호를 입력해 주세요" class="w-full px-4 py-3 rounded-xl border border-border bg-canvas focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-on-surface transition-all">
          </div>
          <div id="login-error" class="text-danger text-body-sm font-semibold text-center" style="display:none;"></div>
          <button type="submit" class="bg-primary text-on-primary hover:opacity-90 font-label-md h-[48px] rounded-xl transition-opacity flex items-center justify-center">
            로그인
          </button>
        </form>
      </div>
    </div>

    <!-- 2. Dashboard Area (로그인 후 상태) -->
    <div id="dashboard-section" class="w-full" style="display:none;">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-lg mb-xl">
        <div>
          <h1 class="text-headline-md md:text-headline-lg font-bold text-on-surface">게시글 관리</h1>
          <p class="text-body-md text-body">게시글의 생성, 수정, 삭제를 손쉽게 처리할 수 있습니다.</p>
        </div>
        <div class="flex gap-md w-full md:w-auto">
          <button onclick="location.href='news-write'" class="bg-primary text-on-primary hover:opacity-90 font-label-md px-xl py-3 rounded-xl flex items-center gap-2 transition-opacity flex-1 md:flex-initial justify-center min-h-[44px]">
            <span class="material-symbols-outlined text-[20px]">add</span> 새 글 작성
          </button>
          <button onclick="handleLogout()" class="bg-surface text-on-surface hover:bg-surface-variant font-label-md px-xl py-3 rounded-xl border border-border transition-colors flex-1 md:flex-initial justify-center min-h-[44px]">
            로그아웃
          </button>
        </div>
      </div>

      <div class="bg-canvas border border-border rounded-2xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-low border-b border-border text-on-surface font-label-md text-sm">
                <th class="py-lg px-xl w-20">번호</th>
                <th class="py-lg px-xl w-32">카테고리</th>
                <th class="py-lg px-xl">제목</th>
                <th class="py-lg px-xl w-36">작성일</th>
                <th class="py-lg px-xl w-48 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="posts-table-body" class="divide-y divide-border text-body text-body-md">
              <!-- Dynamic table rows -->
            </tbody>
          </table>
        </div>
        <div id="empty-message" class="py-xxl text-center text-body text-muted" style="display:none;">
          작성된 게시글이 없습니다.
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-surface-container-low w-full py-xxl px-margin-mobile md:px-xl flex flex-col md:flex-row justify-between items-start gap-lg mt-auto border-t border-border mb-16 md:mb-0">
    <div>
      <div class="font-headline-sm text-headline-sm font-bold text-primary mb-md">경춘부동산</div>
      <p class="font-body-sm text-body-sm text-on-surface mb-md">© 2024 경춘부동산. 모든 권리 보유.</p>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-canvas border-t border-border z-40 flex justify-around items-center h-16 shadow-lg">
    <a href="/" class="flex flex-col items-center justify-center w-12 h-12 text-body">
      <span class="material-symbols-outlined text-[24px]">home</span>
      <span class="text-[10px]">홈</span>
    </a>
    <a href="#" class="flex flex-col items-center justify-center w-12 h-12 text-body">
      <span class="material-symbols-outlined text-[24px]">list_alt</span>
      <span class="text-[10px]">매물목록</span>
    </a>
    <a href="news" class="flex flex-col items-center justify-center w-12 h-12 text-body">
      <span class="material-symbols-outlined text-[24px]">newspaper</span>
      <span class="text-[10px]">소식</span>
    </a>
    <a href="admin" class="flex flex-col items-center justify-center w-12 h-12 text-primary">
      <span class="material-symbols-outlined text-[24px]">settings</span>
      <span class="text-[10px]">관리자</span>
    </a>
  </nav>

  <script src="db.js"></script>
  <script>
    async function checkAuth() {
      const isLogged = isAdmin();
      if (isLogged) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        document.getElementById('header-logout-btn').style.display = 'block';
        await renderDashboardTable();
      } else {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('dashboard-section').style.display = 'none';
        document.getElementById('header-logout-btn').style.display = 'none';
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const pwdInput = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');
      
      errEl.style.display = 'none';

      try {
        const config = await loadConfig();
        if (pwdInput === config.admin_password) {
          sessionStorage.setItem('isAdmin', 'true');
          window.location.reload();
        } else {
          errEl.textContent = '비밀번호가 올바르지 않습니다.';
          errEl.style.display = 'block';
        }
      } catch (e) {
        console.error(e);
        errEl.textContent = '로그인 처리 중 오류 발생';
        errEl.style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('isAdmin');
      window.location.reload();
    }

    async function renderDashboardTable() {
      const tbody = document.getElementById('posts-table-body');
      const emptyMsg = document.getElementById('empty-message');
      
      tbody.innerHTML = '';
      emptyMsg.style.display = 'none';

      try {
        const posts = await getPosts();
        if (!posts || posts.length === 0) {
          emptyMsg.style.display = 'block';
          return;
        }

        tbody.innerHTML = posts.map(post => {
          return `
            <tr class="hover:bg-surface-container-low transition-colors">
              <td class="py-md px-xl">${post.id}</td>
              <td class="py-md px-xl">
                <span class="bg-weak-background text-primary text-xs px-2.5 py-1 rounded-full font-semibold">${post.category || '공지'}</span>
              </td>
              <td class="py-md px-xl">
                <a href="news-detail?id=${post.id}" class="hover:text-primary hover:underline font-semibold block max-w-md truncate">${post.title}</a>
              </td>
              <td class="py-md px-xl text-body-sm text-muted">${post.date || ''}</td>
              <td class="py-md px-xl">
                <div class="flex items-center justify-center gap-2">
                  <button onclick="location.href='news-write?id=${post.id}'" class="text-primary hover:bg-weak-background p-1.5 rounded-lg flex items-center justify-center min-h-[40px] min-w-[40px]" title="수정">
                    <span class="material-symbols-outlined text-[20px]">edit</span>
                  </button>
                  <button onclick="handleDelete(${post.id})" class="text-error hover:bg-error-container hover:text-on-error-container p-1.5 rounded-lg flex items-center justify-center min-h-[40px] min-w-[40px]" title="삭제">
                    <span class="material-symbols-outlined text-[20px]">delete</span>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        emptyMsg.textContent = '게시글 목록 로드 중 오류가 발생했습니다.';
        emptyMsg.style.display = 'block';
      }
    }

    async function handleDelete(id) {
      if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
        try {
          await deletePost(id);
          await renderDashboardTable();
        } catch (err) {
          alert('삭제 실패: ' + err.message);
        }
      }
    }

    checkAuth();
  </script>
</body>
</html>
