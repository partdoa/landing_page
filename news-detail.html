      </div>
    </div>
    <nav class="hidden md:flex items-center gap-xl">
      <a class="text-body dark:text-surface-variant font-body-md hover:text-primary dark:hover:text-primary-fixed-dim hover:bg-weak-background dark:hover:bg-on-secondary-fixed-variant transition-colors px-3 py-2 rounded-lg" href="/">홈</a>
      <a class="text-body dark:text-surface-variant font-body-md hover:text-primary dark:hover:text-primary-fixed-dim hover:bg-weak-background dark:hover:bg-on-secondary-fixed-variant transition-colors px-3 py-2 rounded-lg" href="properties">매물목록</a>
      <a class="text-primary dark:text-primary-fixed-dim font-bold border-b-2 border-primary dark:border-primary-fixed-dim pb-1 px-3 py-2" href="news">뉴스/소식</a>
    </nav>
    <a href="tel:010-9077-3086" class="bg-primary text-on-primary font-label-md text-label-md px-lg py-md rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">phone</span>
      전화상담
    </a>
  </header>

  <main class="flex-grow w-full max-w-4xl mx-auto px-margin-mobile md:px-xl py-xl md:py-xxl">
    <div class="mb-lg">
      <a href="news" class="inline-flex items-center gap-2 text-primary font-label-md hover:underline py-2">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span> 목록으로 돌아가기
      </a>
    </div>

    <article id="detail-card" class="bg-canvas border border-border rounded-2xl p-lg md:p-xl shadow-sm mb-lg">
      <div id="loading-spinner" class="py-xxl text-center text-body">소식을 불러오는 중입니다...</div>
      <div id="post-header" style="display:none;" class="border-b border-border pb-xl mb-xl">
        <div class="flex items-center gap-2 mb-md">
          <span id="post-category" class="bg-weak-background text-primary text-xs px-3 py-1 rounded-full font-semibold"></span>
          <span id="post-date" class="text-body-sm text-muted text-xs"></span>
        </div>
        <h1 id="post-title" class="text-headline-sm md:text-headline-lg font-bold text-on-surface leading-tight"></h1>
      </div>
      <div id="post-content" style="display:none;" class="prose prose-blue max-w-none text-on-background text-body-md">
        <!-- Rendered Markdown goes here -->
      </div>
    </article>

    <!-- Admin actions -->
    <div id="admin-actions" style="display:none;" class="flex justify-end gap-md mb-xxl">
      <button id="edit-btn" class="bg-surface text-on-surface hover:bg-surface-variant font-label-md px-xl py-3 rounded-xl border border-border flex items-center gap-2 transition-colors min-h-[44px]">
        <span class="material-symbols-outlined text-[20px]">edit</span> 수정하기
      </button>
      <button id="delete-btn" class="bg-error text-on-error hover:opacity-90 font-label-md px-xl py-3 rounded-xl flex items-center gap-2 transition-opacity min-h-[44px]">
        <span class="material-symbols-outlined text-[20px]">delete</span> 삭제하기
      </button>
    </div>
  </main>

  <footer class="bg-surface-container-low dark:bg-on-surface w-full py-xxl px-margin-mobile md:px-xl flex flex-col md:flex-row justify-between items-start gap-lg mt-auto border-t border-border mb-16 md:mb-0">

      <div class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed-dim mb-md">경춘부동산</div>

    </div>

    </a>
    <a href="admin" class="flex flex-col items-center justify-center w-12 h-12 text-body">
      <span class="material-symbols-outlined text-[24px]">settings</span>
      <span class="text-[10px]">관리자</span>
    </a>
  </nav>

  <script src="db.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const postId = Number(urlParams.get('id'));

    async function loadPostDetail() {
      if (!postId) {
        document.getElementById('loading-spinner').textContent = '올바르지 않은 게시글 ID입니다.';
        return;
      }

      try {
        const posts = await getPosts();
        const post = posts.find(p => p.id === postId);

        if (!post) {
          document.getElementById('loading-spinner').textContent = '존재하지 않는 게시글입니다.';
          return;
        }

        document.getElementById('loading-spinner').style.display = 'none';
        document.getElementById('post-header').style.display = 'block';
        document.getElementById('post-content').style.display = 'block';

        document.getElementById('post-title').textContent = post.title;
        document.getElementById('post-category').textContent = post.category || '공지';
        document.getElementById('post-date').textContent = post.date || '';
        document.getElementById('post-content').innerHTML = renderMarkdown(post.content);

        if (isAdmin()) {
          document.getElementById('admin-actions').style.display = 'flex';
          document.getElementById('edit-btn').onclick = () => {
            window.location.href = `news-write?id=${post.id}`;
          };
          document.getElementById('delete-btn').onclick = async () => {
            if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
              try {
                await deletePost(post.id);
                window.location.href = 'news';
              } catch (err) {
                alert('삭제 실패: ' + err.message);
              }
            }
          };
        }
      } catch (e) {
        console.error('Failed to load post detail', e);
        document.getElementById('loading-spinner').textContent = '게시글을 불러오는 도중 오류가 발생했습니다.';
      }
    }

    loadPostDetail();
  </script>
</body>
