              "error": "#ba1a1a",
              "inverse-on-surface": "#eff0fa",
              "on-secondary-fixed-variant": "#00429b",
              "on-tertiary-fixed-variant": "#743500",
              "on-primary-fixed": "#001a40",
              "primary-fixed": "#d7e2ff",
              "on-error-container": "#93000a",
              "on-tertiary": "#ffffff",
              "muted": "#8b95a1",

              "surface-container-lowest": "#ffffff",
              "on-secondary-container": "#fefcff",

              "surface-dim": "#d8d9e3",
              "secondary": "#0056c6",
              "on-primary-fixed-variant": "#004491",
              "on-primary": "#ffffff",
              "border": "#e5e8eb",
              "surface-variant": "#e0e2ec",
              "on-tertiary-container": "#fffbff",

              "full": "9999px"

            "spacing": {

              "margin-mobile": "20px",
              "lg": "16px",
              "md": "8px",
              "sm": "6px",
              "xl": "24px",
              "gutter": "12px",
              "xxl": "32px"
            },
            "fontFamily": {
              "body-sm": ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],

</head>
<body class="bg-background text-on-background font-body-md antialiased relative min-h-screen flex flex-col pb-24 md:pb-0">
  <header class="bg-canvas dark:bg-on-surface sticky top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-xl h-16 max-w-7xl mx-auto shadow-sm">
    <div class="flex items-center">
      <div class="flex items-center gap-2" onclick="location.href='/'" class="cursor-pointer">
        <img alt="경춘부동산 로고" class="h-10 w-auto object-cover rounded-md" src="agent.jpg">
        <span class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim cursor-pointer">경춘부동산</span>
      </div>
    </div>
    <nav class="hidden md:flex items-center gap-xl">
      <a class="text-body dark:text-surface-variant font-body-md hover:text-primary dark:hover:text-primary-fixed-dim hover:bg-weak-background dark:hover:bg-on-secondary-fixed-variant transition-colors px-3 py-2 rounded-lg" href="/">홈</a>
      <a class="text-body dark:text-surface-variant font-body-md hover:text-primary dark:hover:text-primary-fixed-dim hover:bg-weak-background dark:hover:bg-on-secondary-fixed-variant transition-colors px-3 py-2 rounded-lg" href="properties">매물목록</a>
      <a class="text-primary dark:text-primary-fixed-dim font-bold border-b-2 border-primary dark:border-primary-fixed-dim pb-1 px-3 py-2" href="news">뉴스/소식</a>
    </nav>
    <a href="tel:031-592-8889" class="bg-primary text-on-primary font-label-md text-label-md px-lg py-md rounded-lg hover:opacity-90 transition-opacity flex items-center gap-2">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">phone</span>
      전화상담
    </a>
  </header>

  <main class="flex-grow w-full max-w-7xl mx-auto px-margin-mobile md:px-xl py-xl md:py-xxl">
    <!-- Page Header & Search -->
    <div class="mb-xl md:mb-xxl flex flex-col md:flex-row justify-between items-start md:items-end gap-lg">
      <div>
        <h1 class="font-headline-xl text-headline-xl md:font-headline-xl md:text-headline-xl text-on-surface mb-md">부동산 뉴스 &amp; 소식</h1>
        <p class="font-body-md text-body-md text-body">금곡동 및 주변 지역의 최신 부동산 동향과 소식을 확인하세요.</p>
      </div>
      <div class="w-full md:w-auto relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
        <input id="search-input" class="w-full md:w-[300px] pl-10 pr-4 py-3 rounded-xl border border-border bg-canvas focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-sm text-body-sm text-on-surface transition-all" placeholder="뉴스 검색..." type="text">
      </div>
    </div>

    <!-- Bento Grid for Featured News (검색 시 숨김) -->
    <div id="featured-grid" class="grid grid-cols-1 md:grid-cols-12 gap-lg mb-xxl">
      <!-- Featured Large (최신 1번째 글) -->
      <article id="featured-large" class="md:col-span-8 bg-surface rounded-xl overflow-hidden group cursor-pointer border border-border hover:border-primary-fixed-dim transition-colors h-full flex flex-col relative" style="display:none;">
        <!-- Dynamic content -->
      </article>
      <!-- Side Featured (최신 2, 3번째 글) -->
      <div id="featured-side" class="md:col-span-4 hidden md:flex flex-col gap-lg" style="display:none;">
        <!-- Dynamic content -->
      </div>
    </div>

    <!-- Recent News List (TDS Style) -->
    <div class="mb-xxl">
      <h2 id="list-title" class="font-headline-sm text-headline-sm text-on-surface mb-lg flex items-center gap-2">최신 소식</h2>
      <div id="news-list" class="flex flex-col border-t border-border">
        <!-- Dynamic content -->
      </div>

      <!-- Pagination -->
      <div id="pagination-container" class="flex justify-center items-center gap-2 mt-xl" style="display:none;">
        <!-- Dynamic content -->
      </div>
    </div>
  </main>

  <button onclick="location.href='tel:031-592-8889'" class="fixed bottom-20 right-margin-mobile md:bottom-xl md:right-xl w-14 h-14 bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:scale-105 hover:shadow-xl transition-all z-40 group">
    <span class="material-symbols-outlined text-[28px] group-hover:rotate-12 transition-transform">phone_in_talk</span>
  </button>

  <footer class="bg-surface-container-low dark:bg-on-surface w-full py-xxl px-margin-mobile md:px-xl flex flex-col md:flex-row justify-between items-start gap-lg mt-auto border-t border-border mb-16 md:mb-0">
    <div>
      <div class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed-dim mb-md">경춘부동산</div>
      <p class="font-body-sm text-body-sm text-on-surface dark:text-surface-bright mb-md">© 2024 경춘부동산. 모든 권리 보유.</p>
    </div>
    <div class="flex flex-col gap-sm">
      <span class="font-label-md text-label-md text-body dark:text-surface-variant">주소: 성남시 금곡동</span>
      <span class="font-label-md text-label-md text-body dark:text-surface-variant">등록번호: 제123-45-67890호</span>
      <span class="font-label-md text-label-md text-body dark:text-surface-variant">연락처: 010-1234-5678</span>
      <a href="admin.html" class="font-label-md text-label-md text-body dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim underline transition-colors">Agent Login</a>
    </div>
  </footer>

  <!-- Mobile Bottom Navigation Bar (모바일 하단 고정 바) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-canvas border-t border-border z-40 flex justify-around items-center h-16 shadow-lg">
    <a href="/" class="flex flex-col items-center justify-center w-12 h-12 text-body">
      <span class="material-symbols-outlined text-[24px]">home</span>
      <span class="text-[10px]">홈</span>
    </a>
    <a href="properties" class="flex flex-col items-center justify-center w-12 h-12 text-body">
      <span class="material-symbols-outlined text-[24px]">list_alt</span>
      <span class="text-[10px]">매물목록</span>
    </a>
    <a href="news" class="flex flex-col items-center justify-center w-12 h-12 text-primary">
      <span class="material-symbols-outlined text-[24px]">newspaper</span>
      <span class="text-[10px]">소식</span>
    </a>
    <a href="admin" class="flex flex-col items-center justify-center w-12 h-12 text-body">
      <span class="material-symbols-outlined text-[24px]">settings</span>
      <span class="text-[10px]">관리자</span>
    </a>
  </nav>

  <script src="db.js"></script>
  <script>
    let allPosts = [];
    let currentPage = 1;
    const itemsPerPage = 5;

    async function loadData() {
      try {
        allPosts = await getPosts();
        renderNews();
      } catch (e) {
        console.error('Failed to load news posts', e);
        document.getElementById('news-list').innerHTML = '<div class="py-xl text-center text-body text-danger">소식을 불러오는 데 실패했습니다.</div>';
      }
    }

    function renderNews() {
      const searchInput = document.getElementById('search-input');
      const query = searchInput.value.trim().toLowerCase();
      const featuredGrid = document.getElementById('featured-grid');
      const listTitle = document.getElementById('list-title');

      let filtered = allPosts;
      if (query) {
        filtered = allPosts.filter(post => 
          post.title.toLowerCase().includes(query) || 
          post.content.toLowerCase().includes(query) ||
          (post.category && post.category.toLowerCase().includes(query))
        );
        featuredGrid.style.display = 'none';
        listTitle.textContent = `검색 결과 (${filtered.length})`;
      } else {
        featuredGrid.style.display = 'grid';
        listTitle.textContent = '최신 소식';
      }

      const listContainer = document.getElementById('news-list');
      const paginationContainer = document.getElementById('pagination-container');

      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="py-xl text-center text-body">등록된 게시글이 없습니다.</div>';
        paginationContainer.style.display = 'none';
        document.getElementById('featured-large').style.display = 'none';
        document.getElementById('featured-side').style.display = 'none';
        return;
      }

      let listPosts = filtered;

      if (!query) {
        const featuredLarge = document.getElementById('featured-large');
        const featuredSide = document.getElementById('featured-side');

        if (filtered.length >= 1) {
          const first = filtered[0];
          const summary = markdownToText(first.content).slice(0, 160) + '...';
          featuredLarge.innerHTML = `
            <div onclick="location.href='news-detail?id=${first.id}'" class="flex-grow flex flex-col">
              <div class="relative w-full h-[240px] sm:h-[320px] md:h-[380px] overflow-hidden bg-surface-container-low flex items-center justify-center">
                <span class="material-symbols-outlined text-[64px] text-primary opacity-20">newspaper</span>
                <div class="absolute top-4 left-4">
                  <span class="bg-primary text-on-primary font-label-md text-label-md px-3 py-1 rounded-full shadow-sm">${first.category || 'Market Update'}</span>
                </div>
              </div>
              <div class="p-lg md:p-xl flex flex-col flex-grow bg-canvas">
                <div class="flex items-center gap-3 mb-md">
                  <span class="font-body-sm text-body-sm text-muted flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">calendar_today</span> ${first.date || ''}
                  </span>
                </div>
                <h2 class="font-headline-md text-headline-md text-on-surface mb-sm group-hover:text-primary transition-colors line-clamp-2">${first.title}</h2>
                <p class="font-body-md text-body-md text-body line-clamp-3">${summary}</p>
              </div>
            </div>
          `;
          featuredLarge.style.display = 'block';
        } else {
          featuredLarge.style.display = 'none';
        }

        if (filtered.length >= 2) {
          featuredSide.style.display = 'flex';
          let sideHtml = '';
          const sideItems = filtered.slice(1, 3);
          sideItems.forEach(post => {
            const sideSummary = markdownToText(post.content).slice(0, 80) + '...';
            sideHtml += `
              <article onclick="location.href='news-detail?id=${post.id}'" class="bg-canvas rounded-xl overflow-hidden group cursor-pointer border border-border hover:border-primary-fixed-dim transition-colors flex flex-col h-full">
                <div class="relative w-full h-[140px] overflow-hidden bg-surface-container-low flex items-center justify-center">
                  <span class="material-symbols-outlined text-[48px] text-primary opacity-20">campaign</span>
                  <div class="absolute top-3 left-3">
                    <span class="bg-surface-variant text-on-surface-variant font-label-md text-[13px] px-2 py-1 rounded-full">${post.category || 'News'}</span>
                  </div>
                </div>
                <div class="p-lg flex flex-col flex-grow">
                  <span class="font-body-sm text-body-sm text-muted mb-sm">${post.date || ''}</span>
                  <h3 class="font-label-md text-label-md text-on-surface mb-xs group-hover:text-primary transition-colors line-clamp-2">${post.title}</h3>
                  <p class="font-body-sm text-body-sm text-body line-clamp-2 mt-auto">${sideSummary}</p>
                </div>
              </article>
            `;
          });
          featuredSide.innerHTML = sideHtml;
        } else {
          featuredSide.style.display = 'none';
        }

        listPosts = filtered.slice(3);
      } else {
        document.getElementById('featured-large').style.display = 'none';
        document.getElementById('featured-side').style.display = 'none';
      }

      const totalItems = listPosts.length;
      if (totalItems === 0) {
        listContainer.innerHTML = '<div class="py-lg text-center text-body text-muted">이전 소식들이 여기에 정렬됩니다.</div>';
        paginationContainer.style.display = 'none';
        return;
      }

      const totalPages = Math.ceil(totalItems / itemsPerPage);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
      const pageItems = listPosts.slice(startIndex, endIndex);

      listContainer.innerHTML = pageItems.map(post => {
        const itemSummary = markdownToText(post.content).slice(0, 100) + '...';
        return `
          <a class="group flex flex-col sm:flex-row gap-lg py-lg border-b border-border hover:bg-surface-container-low transition-colors rounded-lg -mx-4 px-4 sm:mx-0 sm:px-2" href="news-detail?id=${post.id}">
            <div class="w-full sm:w-[200px] h-[140px] sm:h-[120px] rounded-lg overflow-hidden shrink-0 bg-surface flex items-center justify-center">
              <span class="material-symbols-outlined text-[48px] text-muted font-light">article</span>
            </div>
            <div class="flex flex-col justify-center flex-grow">
              <div class="flex items-center gap-2 mb-sm">
                <span class="font-body-sm text-body-sm text-primary font-semibold">${post.category || 'Notice'}</span>
                <span class="w-1 h-1 rounded-full bg-border"></span>
                <span class="font-body-sm text-body-sm text-muted">${post.date || ''}</span>
              </div>
              <h3 class="font-label-md text-label-md md:text-headline-sm md:font-headline-sm text-on-surface mb-sm group-hover:text-primary transition-colors line-clamp-1">${post.title}</h3>
              <p class="font-body-sm text-body-sm md:font-body-md md:text-body-md text-body line-clamp-2">${itemSummary}</p>
            </div>
            <div class="hidden sm:flex items-center justify-center pl-4 text-muted group-hover:text-primary transition-colors">
              <span class="material-symbols-outlined">arrow_forward_ios</span>
            </div>
          </a>
        `;
      }).join('');

      if (totalPages > 1) {
        paginationContainer.style.display = 'flex';
        let pagHtml = `
          <button onclick="changePage(${currentPage - 1})" class="w-10 h-10 rounded-lg flex items-center justify-center border border-border text-muted hover:bg-surface-container-low transition-colors disabled:opacity-50" ${currentPage === 1 ? 'disabled' : ''}>
            <span class="material-symbols-outlined text-[20px]">chevron_left</span>
          </button>
        `;
        for (let i = 1; i <= totalPages; i++) {
          if (i === currentPage) {
            pagHtml += `<button class="w-10 h-10 rounded-lg flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md">${i}</button>`;
          } else {
            pagHtml += `<button onclick="changePage(${i})" class="w-10 h-10 rounded-lg flex items-center justify-center border border-border text-body hover:bg-surface-container-low transition-colors font-label-md text-label-md">${i}</button>`;
          }
        }
        pagHtml += `
          <button onclick="changePage(${currentPage + 1})" class="w-10 h-10 rounded-lg flex items-center justify-center border border-border text-muted hover:bg-surface-container-low transition-colors disabled:opacity-50" ${currentPage === totalPages ? 'disabled' : ''}>
            <span class="material-symbols-outlined text-[20px]">chevron_right</span>
          </button>
        `;
        paginationContainer.innerHTML = pagHtml;
      } else {
        paginationContainer.style.display = 'none';
      }
    }

    function changePage(page) {
      currentPage = page;
      renderNews();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('search-input').addEventListener('input', () => {
      currentPage = 1;
      renderNews();
    });

    loadData();
  </script>
</body>
</html>
